<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Judy Massage Spa | Premium Massage Therapy</title>

<style>
:root {
--bg:#0f0f0f;
--accent:#c026d3;
--text:#e5e5e5;
}
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Segoe UI',system-ui,sans-serif;
background:var(--bg);
color:var(--text);
}

header{
background:rgba(0,0,0,0.9);
position:fixed;
width:100%;
z-index:1000;
padding:1rem 5%;
display:flex;
justify-content:space-between;
}

.logo{color:var(--accent);font-weight:bold;font-size:1.6rem;}

nav a{color:white;margin-left:15px;text-decoration:none;}

.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
url('https://images.unsplash.com/photo-1544161515-4ae6ce6db874?auto=format&fit=crop&w=1600&q=80') center/cover;
}

.btn{
background:var(--accent);
color:white;
padding:12px 25px;
border-radius:50px;
text-decoration:none;
display:inline-block;
margin-top:15px;
}

section{padding:100px 5%;}

h2{text-align:center;color:var(--accent);margin-bottom:30px;}

.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}

.card{
background:#1a1a1a;
padding:20px;
border-radius:12px;
text-align:center;
border: 1px solid #333;
}

.form-box{
max-width:500px;
margin:auto;
background:#1a1a1a;
padding:20px;
border-radius:12px;
}

input,select,textarea{
width:100%;
margin:10px 0;
padding:12px;
background:#222;
border:1px solid #444;
color:white;
border-radius:6px;
}

button{
width:100%;
padding:12px;
background:var(--accent);
border:none;
color:white;
border-radius:6px;
font-weight:bold;
cursor:pointer;
transition: 0.3s;
}

button:hover{ background: #a21caf; }

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:24px;
text-decoration:none;
z-index: 1001;
box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
</style>
</head>

<body>

<header>
<div class="logo">Judy Massage Spa</div>
<nav>
<a href="#services">Services</a>
<a href="#booking">Book</a>
</nav>
</header>

<section class="hero">
<div>
<h1>Relax. Refresh. Renew.</h1>
<p>Premium massage experience tailored for you</p>
<a href="#booking" class="btn">Book Now</a>
</div>
</section>

<section id="services">
<h2>Our Services</h2>
<div class="services">
<div class="card"><h3>Swedish Massage</h3><p>$120</p></div>
<div class="card"><h3>Deep Tissue</h3><p>$120</p></div>
<div class="card)<h3>Hot Stone</h3><p>$150</p></div>
<div class="card"><h3>Aromatherapy</h3><p>$150</p></div>
</div>
</section>

<section id="booking">
<h2>Book Appointment</h2>
<div class="form-box">

<form action="https://formspree.io/f/mkoyvwag" method="POST">
  
  <input type="text" name="name" placeholder="Full Name" required>
  <input type="email" name="email" placeholder="Email Address" required>
  <input type="tel" name="phone" placeholder="Phone Number" required>

  <select name="service" required>
    <option value="">Select Service</option>
    <option>Swedish Massage</option>
    <option>Deep Tissue Massage</option>
    <option>Hot Stone Massage</option>
    <option>Aromatherapy</option>
  </select>

  <label style="font-size: 0.8rem; color: #888; margin-left: 5px;">Preferred Date:</label>
  <input type="date" name="date" required>
  
  <textarea name="message" placeholder="Preferred time or special requests" rows="3"></textarea>

  <input type="hidden" name="_subject" value="New Booking Request - Judy Massage Spa">

  <button type="submit">Submit Booking</button>

</form>
</div>
</section>

<section style="text-align:center;">
<h2>Contact via WhatsApp</h2>
<p>Prefer chatting? Message us directly</p>
<a href="https://wa.me/12344991665" class="btn">Chat on WhatsApp</a>
</section>

<a href="https://wa.me/12344991665" class="whatsapp">💬</a>

</body>
</html>
